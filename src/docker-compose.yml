# Chromium Web Browser for TerraMaster TOS 7 (Docker application)
#
# Upstream image : accetto/debian-vnc-xfce-chromium-g3 (Docker Hub, tag 13)
#   -> https://github.com/accetto/debian-vnc-xfce-g3
#   Debian 13 (trixie) + Xfce desktop + TigerVNC + noVNC + Chromium taken from
#   the Debian archive (current release), runs as a non-root user by design
#   (uid 1000/1001) and serves its web client over plain HTTP, which is what
#   the TOS Docker app model requires.
#
#   NOTE: use the *Debian* variant, not accetto/ubuntu-vnc-xfce-chromium-g3.
#   The Ubuntu images pin a frozen chromium-browser 112.0.5615.49 (April 2023)
#   .deb from the Ubuntu 18.04 archive; the Debian images install the current
#   chromium from the Debian archive. See README for the comparison.
#
# Why not linuxserver/chromium:
#   * its s6 init writes /etc/nginx and /etc/sudoers and requires root, while
#     TOS forbids root containers (user field is mandatory);
#   * its Selkies web client needs WebCodecs, which browsers only expose in a
#     secure context, so over plain HTTP it logs
#     "FATAL: Not in a secure context. WebCodecs require HTTPS." and shows no
#     picture at all - TOS opens Docker apps as http://${ip}:<port>.
#   See README: "Why not linuxserver/chromium".
#
# TOS rules honoured here:
#   * Docker Hub image only, fixed tag (never :latest)
#   * container_name == application id, restart: unless-stopped
#   * non-root user via the user field, no privileged mode, no host network
#   * all persistent data under /Volume*/DockerAppData/<appid>/
#   * explicit TZ, healthcheck on the only service
#   * no hardcoded credentials: the VNC password is generated on first start
#   * x-app-meta is the last block of this file

services:
  chromiumdocker:
    image: accetto/debian-vnc-xfce-chromium-g3:13
    container_name: chromiumdocker
    restart: unless-stopped
    # TOS policy: containers must run as a non-root user (uid/gid 1000)
    user: "1000:1000"
    # Chromium needs a real /dev/shm; the Docker default of 64 MB crashes tabs
    shm_size: 1gb
    # The image ships /usr/bin/tini -- /dockerstartup/startup.sh as entrypoint.
    # We wrap it to do three things on first start:
    #
    # 1) Generate the VNC password (TOS forbids hardcoded credentials; the
    #    upstream image would otherwise use its well-known default) and persist
    #    it in the mounted home. Two copies are written: `.vnc_password` (0600,
    #    used by tooling) and a plainly named `VNC-PASSWORD.txt` (0644) so the
    #    NAS administrator can find it in the File Manager.
    # 2) Provision a multi-script font set. The trimmed upstream image ships
    #    only 8 DejaVu faces, so Chinese, Japanese, Korean, Arabic, Hebrew,
    #    Thai, every Indic script, Khmer, Myanmar, Ethiopic and all emoji would
    #    render as empty boxes. A TOS docker package may contain exactly four
    #    files, so fonts cannot be shipped inside it; they are fetched once
    #    (about 78 MB, sha256 pinned, Debian mirrors + Noto) into the mounted
    #    data directory and fontconfig picks them up from there. The download
    #    is skipped if it already happened, is skipped entirely when FONTS=off,
    #    and never blocks the container: on failure the app still runs and the
    #    user can simply copy font files into that directory instead.
    # 3) Purge the stale Chromium SingletonLock. A recreated container gets a
    #    new hostname, and Chromium then refuses to start with "the profile
    #    appears to be in use by another Chromium process on another computer",
    #    which aborts the startup script and puts the container into a restart
    #    loop on every upgrade.
    #
    # IMPORTANT: every '$' below is deliberately written as '$$'. docker compose
    # performs ${VAR} interpolation on this file, so an unescaped ${HOME} would
    # be replaced by the *host's* root home and undefined variables would
    # silently expand to an empty string.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -u
        rm -f /home/headless/.config/chromium/SingletonLock \
              /home/headless/.config/chromium/SingletonSocket \
              /home/headless/.config/chromium/SingletonCookie 2>/dev/null || true
        PW=/home/headless/.vnc_password
        VIS=/home/headless/VNC-PASSWORD.txt
        FONTDIR=/home/headless/.local/share/fonts
        FMARK=$$FONTDIR/.provisioned-1
        FFLAG=/tmp/.fonts-provisioning
        if [ -s "$$PW" ]; then
          read -r VNC_PW < "$$PW"
          cp "$$PW" /tmp/.vnc_pw 2>/dev/null || true
        else
          head -c 256 /dev/urandom | tr -dc A-Za-z0-9 | head -c 16 > /tmp/.vnc_pw
          read -r VNC_PW < /tmp/.vnc_pw
        fi
        export VNC_PW
        # Persist the password and publish the info page. Both writes are
        # retried: a freshly created bind-mount source (config, and on the
        # first run of a new mount also config/info) is created root-owned by
        # Docker and only becomes writable once the upstream startup script has
        # chowned the mounted home to the container user.
        (
          n=0
          while [ "$$n" -lt 60 ]; do
            if [ -s /tmp/.vnc_pw ]; then
              ok=1
              if [ "$${SHOW_PASSWORD:-on}" != "off" ]; then
                mkdir -p /home/headless/info 2>/dev/null || true
                {
                  echo '<!doctype html><html lang="en"><head><meta charset="utf-8">'
                  echo '<meta name="viewport" content="width=device-width,initial-scale=1">'
                  echo '<title>Chromium Web Browser</title><style>'
                  echo 'body{font-family:system-ui,sans-serif;background:#101418;color:#e8eaed;max-width:44rem;margin:0 auto;padding:2.5rem 1.5rem;line-height:1.7}'
                  echo 'code{background:#1e2630;padding:.15em .45em;border-radius:.3em}a{color:#8ab4f8}'
                  echo 'td{padding:.2rem 1rem .2rem 0}table{border-collapse:collapse}'
                  echo '</style></head><body><h2>Chromium Web Browser</h2><table>'
                  echo '<tr><td>Open the browser</td><td><a href="../vnc.html">vnc.html</a></td></tr>'
                  echo '<tr><td>VNC password</td><td><code>'
                  cat /tmp/.vnc_pw
                  echo '</code></td></tr></table>'
                  echo '<p>To change it, edit <code>.vnc_password</code> in'
                  echo '<code>&lt;volume&gt;/DockerAppData/chromiumdocker/config/</code>'
                  echo 'on the NAS and restart the application.</p><hr>'
                  echo '<p>中文：点上面的 <b>vnc.html</b> 打开浏览器，密码见上表。'
                  echo '要更换密码，请在 NAS 上编辑数据目录里的 <code>.vnc_password</code> 后重启应用。</p>'
                  echo '</body></html>'
                } > /home/headless/info/index.html 2>/dev/null || ok=0
                cp /tmp/.vnc_pw /home/headless/info/VNC-PASSWORD.txt 2>/dev/null || ok=0
                chmod 0644 /home/headless/info/index.html /home/headless/info/VNC-PASSWORD.txt 2>/dev/null || true
              fi
              if (umask 077; cat /tmp/.vnc_pw > "$$PW") 2>/dev/null && [ -s "$$PW" ]; then
                {
                  echo "Chromium Web Browser - VNC login password"
                  echo
                  cat /tmp/.vnc_pw
                  echo
                  echo "Open http://<NAS-IP>:8901/ and enter this password."
                } > "$$VIS" 2>/dev/null || true
                chmod 0644 "$$VIS" 2>/dev/null || true
              else
                ok=0
              fi
              if [ "$$ok" = 1 ]; then
                rm -f /tmp/.vnc_pw
                break
              fi
            fi
            n=$$((n + 1))
            sleep 2
          done
        ) &
        # provision the multi-script fonts, once, without blocking the container
        if [ ! -s "$$FMARK" ] && [ "$${FONTS:-on}" != "off" ]; then
          touch "$$FFLAG"
          cat > /tmp/provision-fonts.py <<'PYEOF'
        @@PROVISION_PY@@
        PYEOF
          (
            n=0
            while [ "$$n" -lt 30 ] && [ ! -w /home/headless ]; do
              n=$$((n + 1))
              sleep 2
            done
            python3 /tmp/provision-fonts.py "$$FONTDIR" "$$FMARK" || true
            [ -s "$$FMARK" ] && fc-cache -f >/dev/null 2>&1 || true
            rm -f "$$FFLAG" /tmp/provision-fonts.py
          ) &
        fi
        exec /usr/bin/tini -- /dockerstartup/startup.sh --wait \
          "timeout 180 sh -c 'while [ -e /tmp/.fonts-provisioning ]; do sleep 2; done' ; chromium --no-sandbox --disable-gpu --start-maximized"
    ports:
      # host:container - host port in the TOS-recommended 8000-19999 range
      - "8901:6901"
    environment:
      # explicit timezone (TOS requirement; change to your local zone if needed)
      TZ: Asia/Shanghai
      # desktop geometry streamed through noVNC
      VNC_RESOLUTION: 1600x900
      VNC_COL_DEPTH: "24"
      VNC_PORT: "5901"
      NOVNC_PORT: "6901"
      VNC_CONFIG_HOME: /home/headless/.config/tigervnc
      # set FONTS=off to skip the one-time multi-script font download (about
      # 78 MB); users can then drop .ttf/.otf/.ttc into <data>/.local/share/fonts
      FONTS: "on"
      # the VNC password (per-install random) is published at
      # http://<NAS-IP>:8901/info/ so that users never need SSH to find it;
      # set SHOW_PASSWORD=off to keep it off the web (then it is only in
      # <data>/.vnc_password and VNC-PASSWORD.txt, readable via SSH)
      SHOW_PASSWORD: "on"
    volumes:
      # whole home directory: Chromium profile, bookmarks, downloads, noVNC/VNC
      # config, the generated VNC password and the provisioned fonts all live
      # here and survive updates
      - /Volume*/DockerAppData/chromiumdocker/config:/home/headless
      # Only the small `info` sub-directory is exposed, never the whole home:
      # this makes the VNC password reachable at
      #   http://<NAS-IP>:8901/info/
      # without SSH. The TOS File Manager cannot reach DockerAppData (its root
      # list contains shared folders only), and the container user cannot write
      # into any shared folder, so this is the only way for a normal user to
      # obtain the password. Set SHOW_PASSWORD=off to keep it off the web.
      - /Volume*/DockerAppData/chromiumdocker/config/info:/usr/libexec/noVNCdim/info:ro
    healthcheck:
      # noVNC/websockify answers on 6901 as soon as the desktop is up
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:6901/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# TOS App Center web metadata (must be the last block of the file)
x-app-meta:
  web:
    port: 8901
    protocol: http
